[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-evals-catalog"
version = "0.1.0"
description = "Public evaluation examples and reproducible runner contracts for Aria"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "numpy>=1.26,<3", "mujoco>=3.2,<4", "trimesh>=4.4,<6"]
runner = ["aria-code @ git+https://github.com/artheras/aria-code.git@983961bf9c4a6016b8c9b30b7ae54d5f18041827"]

[project.scripts]
aria-evals = "aria_evals.cli:main"

[tool.setuptools.packages.find]
include = ["aria_evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
