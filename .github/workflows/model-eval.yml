name: Model evaluation

# Runs the public suite against a real model on a GitHub runner, so results do not
# depend on one laptop's network. It is started by hand and spends provider credit:
# nothing triggers it automatically.
#
# Keys come from repository secrets and reach the engine only as environment
# variables. A missing key fails the run before any task starts.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider recognised by the pinned engine (openai, deepseek, google, anthropic)"
        required: true
        type: choice
        options: [openai, deepseek, google, anthropic]
      model:
        description: "Model name, e.g. gpt-5.4-mini"
        required: true
        type: string
      repeat:
        description: "Attempts per task"
        required: true
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: model-eval-${{ inputs.provider }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,runner]'
      - name: The selected provider has a key
        env:
          PROVIDER: ${{ inputs.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "$PROVIDER" in
            openai) key="$OPENAI_API_KEY" ;; deepseek) key="$DEEPSEEK_API_KEY" ;;
            google) key="$GOOGLE_API_KEY" ;; anthropic) key="$ANTHROPIC_API_KEY" ;;
          esac
          if [ -z "$key" ]; then
            echo "::error::Add the ${PROVIDER} API key as a repository secret before running this workflow."
            exit 1
          fi
      - run: aria-evals check --output runs/preflight
      - name: Run the suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          prices=()
          if [ -f "prices/${PROVIDER}.json" ]; then prices=(--prices "prices/${PROVIDER}.json"); fi
          aria-evals run --provider "$PROVIDER" --model "$MODEL" --repeat "$REPEAT" \
            --solve-timeout 900 --output runs/model "${prices[@]}" || status=$?
          cat runs/model/summary.json >> "$GITHUB_STEP_SUMMARY" || true
          exit "${status:-0}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: model-eval-${{ inputs.provider }}-${{ github.run_id }}
          path: runs/model/summary.json
          if-no-files-found: warn
          retention-days: 90
