name: Model evaluation

# Runs the public suite against a real model on a GitHub runner, so results do not
# depend on one laptop's network. It is started by hand and spends provider credit:
# nothing triggers it automatically.
#
# Keys come from repository secrets and reach the engine only as environment
# variables. Only the selected provider's key is ever placed in a step's
# environment: the agent runs shell commands without permission prompts and
# inherits that environment, so a key it does not need must not be there.
# A missing key fails the run before any task starts.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider recognised by the pinned engine (openai, deepseek, google, anthropic)"
        required: true
        type: choice
        options: [openai, deepseek, google, anthropic]
      model:
        description: "Model name, e.g. gpt-5.4-mini"
        required: true
        type: string
      repeat:
        description: "Attempts per task"
        required: true
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: model-eval-${{ inputs.provider }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,runner]'
      - name: The selected provider has a key
        env:
          PROVIDER: ${{ inputs.provider }}
          # Each branch is guarded by the provider, so this is the selected key or empty.
          SELECTED_KEY: ${{ (inputs.provider == 'openai' && secrets.OPENAI_API_KEY)
            || (inputs.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY)
            || (inputs.provider == 'google' && secrets.GOOGLE_API_KEY)
            || (inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY) || '' }}
        run: |
          if [ -z "$SELECTED_KEY" ]; then
            echo "::error::Add the ${PROVIDER} API key as a repository secret before running this workflow."
            exit 1
          fi
      - run: aria-evals check --output runs/preflight
      - name: Run the suite
        env:
          SELECTED_KEY: ${{ (inputs.provider == 'openai' && secrets.OPENAI_API_KEY)
            || (inputs.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY)
            || (inputs.provider == 'google' && secrets.GOOGLE_API_KEY)
            || (inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY) || '' }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          # Export the one key under the name the engine reads, then drop the generic copy.
          case "$PROVIDER" in
            openai) export OPENAI_API_KEY="$SELECTED_KEY" ;;
            deepseek) export DEEPSEEK_API_KEY="$SELECTED_KEY" ;;
            google) export GOOGLE_API_KEY="$SELECTED_KEY" ;;
            anthropic) export ANTHROPIC_API_KEY="$SELECTED_KEY" ;;
            *) echo "::error::Unknown provider ${PROVIDER}"; exit 1 ;;
          esac
          unset SELECTED_KEY
          prices=()
          if [ -f "prices/${PROVIDER}.json" ]; then prices=(--prices "prices/${PROVIDER}.json"); fi
          aria-evals run --provider "$PROVIDER" --model "$MODEL" --repeat "$REPEAT" \
            --solve-timeout 900 --output runs/model "${prices[@]}" || status=$?
          if [ -f runs/model/summary.json ]; then
            { echo '```json'; cat runs/model/summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${status:-0}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: model-eval-${{ inputs.provider }}-${{ github.run_id }}
          path: runs/model/summary.json
          if-no-files-found: warn
          retention-days: 90
