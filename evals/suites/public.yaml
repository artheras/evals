- id: control-pendulum-swingup-v1
  fixture: ctl_swingup
  prompt: pendulum.xml is a pendulum driven by one torque motor. A joint angle of 0 hangs straight down
    and pi is straight up. The motor is limited to 2 N·m, less than the torque gravity exerts when the
    pendulum is horizontal, so it cannot be lifted straight up and must be swung. The grader starts it
    hanging at rest at angle 0 and simulates 10 seconds. From 6 to 9 seconds it pushes the pendulum with
    brief torques of 0.6 N·m in alternating directions, which the controller is not told about. From 5
    seconds to the end the angle must stay within 0.15 rad of upright (any whole number of turns is fine),
    and in the last 0.5 seconds within 0.02 rad of upright with an angular speed below 0.2 rad/s. Create
    controller.py defining control(t, qpos, qvel) that returns a list with one actuator command per actuator;
    qpos and qvel are numpy arrays of the joint positions and velocities in the model's joint order, and
    t is the simulated time in seconds. The grader calls it before every simulation step at the model's
    timestep, and the model clamps each command to its control range. Use only the arguments and the files
    here, and keep pendulum.xml unchanged.
  verify: '{python} -m pytest -q --noconftest -p no:cacheprovider test_control.py'
  requires: &id002
