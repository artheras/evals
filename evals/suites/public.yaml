- id: firmware-pid-antiwindup-v1
  fixture: fw_pid
  prompt: 'pid.h declares a PID controller. Create pid.c implementing it in C99 with no main function.
    pid_init stores the gains and output limits and resets the state (integral 0, no previous measurement).
    Each pid_update(setpoint, measurement, dt) computes, in this order: error = setpoint - measurement;
    the integral term accumulates ki * error * dt and is then clamped to [out_min, out_max]; the derivative
    term is -kd * (measurement - previous measurement) / dt, taken on the measurement rather than the
    error so a setpoint step causes no kick, and it is 0 on the first update after pid_init; then the
    previous measurement is stored. The returned output is kp * error + integral term + derivative term,
    clamped to [out_min, out_max]. dt may change between calls. Keep pid.h unchanged.'
  verify: '{python} -m pytest -q --noconftest -p no:cacheprovider test_pid.py'
  requires: *id001
