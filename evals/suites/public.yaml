- id: firmware-q15-fixed-point-v1
  fixture: fw_q15
  prompt: q15.h declares Q15 fixed-point helpers for a DSP without floating point (a q15_t value v represents
    v / 32768). Create q15.c implementing them in C99 with no main function. Every result saturates to
    the q15_t range [-32768, 32767] instead of wrapping. q15_add is the saturating sum. q15_mul forms
    the exact product of the two raw values in at least 32 bits, adds 16384 and shifts right by 15 (rounding
    half up, arithmetic shift), then saturates, so q15_mul(-32768, -32768) is 32767. q15_from_double(x)
