- id: firmware-ring-buffer-v1
  fixture: fw_ringbuf
  prompt: 'ringbuf.h declares a byte ring buffer for a microcontroller. Create ringbuf.c implementing
    every function in it in C99 with no dynamic allocation and no main function. It is a FIFO that holds
    exactly RB_CAPACITY bytes at once: rb_push adds a byte and returns true, but when the buffer already
    holds RB_CAPACITY bytes it returns false and changes nothing (it never overwrites). rb_pop removes
    the oldest byte into *out and returns true, or returns false without writing *out when the buffer
    is empty. rb_count returns how many bytes are held, and rb_init empties the buffer. It must keep working
    for any number of operations as the indices wrap around. Keep ringbuf.h unchanged.'
